<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>la casa de papel</title>
</head>
<body>
    <!-- Scene 1 from https://olivier3lanc.github.io/folio-casa-de-papel/ -->
<main class="u-h-100vh">
    <article class="u-h-100vh">
        <figure class="c-position m-fixed m-top-0 u-w-100 u-h-100vh u-brep-no-repeat u-bpos-center u-m-none u-p-none" style="background-image: url(https://olivier3lanc.github.io/folio-casa-de-papel/img/executives/casa_credit_executives_0.webp); will-change: background-image, background-size;" scroll-frames="cdp_executives" data-detector="cdp_scene_detector" data-url-mask="https://olivier3lanc.github.io/folio-casa-de-papel/img/executives/casa_credit_executives_|0 to 23|.webp" data-background-size="cover">
        </figure>
        <h1 class="c-position m-fixed m-middle-center u-tt-uppercase u-fs-xl u-lsp-large u-ws-nowrap u-inline-block u-p-none u-pt-md u-pr-md u-pe-none u-m-none u-lh-1" scroll-btween="cdp_scene" data-detector="cdp_scene_detector" data-transform="translateX(-50%) translateY(|-100 to -50|%)" style="transform:translateX(-50%) translateY(-100%)" u-fs-lg="sm" u-pt-sm="sm" u-pr-sm="sm">

            <span class="c-position m-absolute m-bottom-100 m-right-0 u-block u-pr-md u-pb-sm u-fs-md u-ff-lead-2" u-pr-sm="sm" u-pb-xxs="sm" u-fs-sm="sm">
                Cinematics of
            </span>

            <span class="u-c-primary-max u-fs-xxl u-lh-title u-lsp-title u-z-100" u-fs-xl="sm">
                <span class="u-ws-nowrap">La Casa</span>
                <span class="c-grid m-middle m-nowrap">
                    <span class="u-fs-xl u-p-xs u-bc-primary u-lh-1 u-lsp-none u-mr-xs" u-fs-lg="sm" u-mr-xxs="sm" u-p-xxs="sm">de</span>Papel
                </span>
            </span>

            <span class="c-position m-absolute m-top-0 u-bt-large-solid-primary u-block u-faded" style="width:120%; right: -40%"></span>

            <span class="c-position m-absolute m-right-0 u-bl-large-solid-primary u-block u-faded" style="top:-150px; height: 200%"></span>

            <span class="c-position m-absolute m-top-0 u-bt-large-solid-primary u-block" scroll-btween="cdp_scene_2" data-detector="cdp_scene_detector" data-width="|0 to 120|%" data-right="|-40 to 0|%"></span>

            <span class="c-position m-absolute m-right-0 u-bl-large-solid-primary u-block" scroll-btween="cdp_scene_3" data-detector="cdp_scene_detector" data-top="|0 to -150|%" data-height="|0 to 400|%"></span>
        </h1>
    </article>
    
    <div id="cdp_scene_detector"></div>
    <div id="cdp_screen_height" class="u-h-100vh"></div>
    
    <nav class="c-position m-relative m-botttom-xxl u-pb-xxl m-left-0 c-grid m-center m-nowrap u-w-100" role="navigation">
        <a href="https://olivier3lanc.github.io/folio-casa-de-papel/" class="c-btn m-thin " u-p-sm="sm" u-fs-xs="sm" target="_blank">Launch full experience</a>
    </nav>
    
    <div class="c-position m-fixed m-middle-center m-anchor-top-center u-ta-center u-mt-xl" scroll-btween="cdp_scene_onboarding_mouse" scroll-btween-detector="cdp_scene_detector" data-opacity="|0:1 to 10:1 to 15:0 to 100:0|">
        <div class="c-grid m-center m-middle u-anim-bottom-to-top-transform">
            <span class="c-shape m-chevron-down u-fs-lg"></span>
        </div>
        <p class="u-fs-xs u-m-none u-ff-lead-2 u-c-primary-max u-tt-uppercase">Scroll down</p>
    </div>
</main>
</body>
</html>
